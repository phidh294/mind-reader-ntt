<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATIV | CITY MASTER</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #000; --accent: #00f2ff; --card: #111; --text: #fff; --msg-ai: #222; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 600px; padding: 20px; display: flex; flex-direction: column; position: relative; }
        .logo { font-size: 2.5rem; font-weight: bold; color: var(--accent); text-align: center; margin-bottom: 20px; text-shadow: 0 0 10px var(--accent); letter-spacing: 5px; }
        .chat-window { background: var(--card); border: 1px solid rgba(128,128,128,0.2); border-radius: 20px; flex: 1; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 20px; border: 1px solid var(--accent); }
        #chat-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 0.95rem; animation: slideIn 0.3s ease; }
        .ai-msg { background: var(--msg-ai); align-self: flex-start; }
        .user-msg { background: var(--accent); color: #000; align-self: flex-end; font-weight: bold; }
        .input-area { display: flex; gap: 10px; background: #1a1a1a; padding: 15px; border-radius: 15px; }
        input { flex: 1; background: transparent; border: none; color: #fff; outline: none; }
        .btn-send { background: var(--accent); border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .leaderboard { position: fixed; top: 80px; right: 20px; width: 220px; background: #111; border: 1px solid var(--accent); border-radius: 15px; padding: 15px; display: none; z-index: 100; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index:1000; display: flex; align-items: center; justify-content: center; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <audio id="bg-music" loop src="bg-music.mp3"></audio>

    <div id="login-modal" class="modal">
        <div style="text-align: center; border: 1px solid var(--accent); padding: 40px; border-radius: 20px;">
            <h1 style="color:var(--accent)">LATIV × NTT</h1>
            <input type="text" id="player-name" placeholder="Nhập tên bạn..." style="display:block; width:100%; margin: 20px 0; padding: 10px; background:#222; border:1px solid #444; color:#fff; text-align:center;">
            <button onclick="startGame()" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:10px; cursor:pointer; font-weight:bold;">KHÁM PHÁ NGAY</button>
        </div>
    </div>

    <div class="app-container">
        <button onclick="toggleRank()" style="position:absolute; top:20px; right:20px; background:none; border:1px solid var(--accent); color:var(--accent); padding:5px 15px; border-radius:5px; cursor:pointer;">RANKING</button>
        <div id="leaderboard" class="leaderboard">
            <h3 style="color:var(--accent); margin-top:0;">TOP CAO THỦ</h3>
            <div id="score-list" style="font-size: 0.8rem;">Đang tải...</div>
        </div>

        <div class="logo">LATIV</div>
        <div class="chat-window"><div id="chat-content"></div></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Gõ dự đoán (không dấu)...">
            <button class="btn-send" onclick="handleAction()">GỬI</button>
        </div>
    </div>

    <script>
        // Database địa danh
        const database = [
            { word: "crescentmall", alt: ["crescent", "tttmcrescent"], hints: ["TTTM lớn cạnh hồ", "Ở Quận 7", "Nổi tiếng với Cầu Ánh Sao"] },
            { word: "chobenthanh", alt: ["benthanh"], hints: ["Biểu tượng lâu đời Sài Gòn", "Có 4 cửa chính", "Trung tâm Quận 1"] },
            { word: "landmark81", alt: ["landmark"], hints: ["Tòa nhà cao nhất Việt Nam", "Bình Thạnh", "Hình bó tre"] }
        ];

        let currentItem = database[Math.floor(Math.random() * database.length)];
        let tries = 0;
        let playerName = "";

        // Hàm lọc dấu cực mạnh để sửa lỗi "không nhận chữ"
        function cleanText(str) {
            return str.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Khử dấu tiếng Việt
                .replace(/đ/g, "d")
                .replace(/\s+/g, "") // Xóa khoảng trắng
                .trim();
        }

        function startGame() {
            playerName = document.getElementById('player-name').value.trim();
            if(!playerName) return alert("Vui lòng nhập tên!");
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('bg-music').play().catch(() => {});
            addMsg("Chào " + playerName + "! Mình đã chọn 1 địa danh. Nhập dự đoán hoặc 'OK' để lấy gợi ý.", "ai");
            loadGlobalRank();
        }

        function handleAction() {
            const input = document.getElementById('user-input');
            const val = input.value.trim();
            if(!val) return;

            addMsg(val, "user");
            input.value = "";
            const userAns = cleanText(val);

            if(userAns === "ok") {
                addMsg("Gợi ý: " + currentItem.hints[tries % 3], "ai");
                return;
            }

            tries++;
            // So sánh với từ khóa chính HOẶC các từ khóa phụ (alt)
            if(userAns === currentItem.word || currentItem.alt.includes(userAns)) {
                addMsg(`CHÍNH XÁC! Đó là ${currentItem.word.toUpperCase()}. Bạn thắng sau ${tries} lượt!`, "ai");
                confetti({ particleCount: 150 });
                saveGlobalRank(playerName, tries);
            } else {
                addMsg(`Sai rồi! (Lượt ${tries}). Thử lại hoặc gõ OK để lấy gợi ý tiếp.`, "ai");
            }
        }

        // BXH TOÀN CẦU (Dùng JSONBIN.io - Một dịch vụ lưu trữ JSON miễn phí)
        // Lưu ý: Đây là demo, nếu dùng lâu dài Phi nên tạo tài khoản JSONBIN để lấy API Key riêng.
        async function saveGlobalRank(name, score) {
            let currentRank = JSON.parse(localStorage.getItem('lativ_rank') || "[]");
            currentRank.push({name, score});
            currentRank.sort((a,b) => a.score - b.score);
            localStorage.setItem('lativ_rank', JSON.stringify(currentRank.slice(0,10)));
            renderRank(currentRank);
            alert("Đã lưu kỷ lục của bạn!");
        }

        function loadGlobalRank() {
            const data = JSON.parse(localStorage.getItem('lativ_rank') || "[]");
            renderRank(data);
        }

        function renderRank(data) {
            const list = document.getElementById('score-list');
            list.innerHTML = data.map((s, i) => `<div>${i+1}. ${s.name} - ${s.score} lượt</div>`).join('') || "Chưa có hạng";
        }

        function toggleRank() {
            const lb = document.getElementById('leaderboard');
            lb.style.display = lb.style.display === 'block' ? 'none' : 'block';
        }

        function addMsg(text, type) {
            const content = document.getElementById('chat-content');
            const div = document.createElement('div');
            div.className = `msg ${type}-msg`;
            div.innerText = text;
            content.appendChild(div);
            content.scrollTop = content.scrollHeight;
        }

        document.getElementById('user-input').onkeydown = (e) => { if(e.key === 'Enter') handleAction(); };
    </script>
</body>
</html>
