<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giao Dịch Tài Chính & Chỉ Số Chứng Khoán</title>
<link rel="icon" type="image/png" href="logo.png">
    <style>

        /* Biến màu sắc hệ thống - Mặc định là Dark Mode */
        :root {
            --bg-main: #121212;
            --bg-sidebar: #181818;
            --bg-header: #222222;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --accent-color: #3498db;
            --hover-color: #2c3e50;
        }

        /* Biến màu sắc khi chuyển sang Light Mode */
        body.light-mode {
            --bg-main: #f9f9f9;
            --bg-sidebar: #f0f0f0;
            --bg-header: #e0e0e0;
            --text-color: #1a1a1a;
            --text-muted: #555555;
            --border-color: #cccccc;
            --accent-color: #2980b9;
            --hover-color: #e1f5fe;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background: var(--bg-main);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        /* Thanh bên Sidebar */
        #sidebar {
            width: 380px;
            background: var(--bg-sidebar);
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: background 0.3s, border 0.3s;
        }

        #sidebar-header {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Khu vực hiển thị Video */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            align-items: center;
            justify-content: center;
        }

        #video-player {
            width: 100%;
            max-width: 850px;
            height: auto;
            border-radius: 12px;
            background: #000000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: block;
        }

        #current-title {
            margin-top: 25px;
            font-size: 20px;
            text-align: center;
        }

        /* Thiết kế các Thư mục Thu gọn */
        .category-group {
            border-bottom: 1px solid var(--border-color);
        }

        .category-title {
            padding: 15px 20px;
            cursor: pointer;
            font-weight: bold;
            background: var(--bg-header);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }

        .category-title:hover {
            opacity: 0.9;
        }

        .category-title::after {
            content: '▼';
            font-size: 10px;
            transition: transform 0.2s;
        }

        .category-group.collapsed .category-title::after {
            transform: rotate(-90deg);
        }

        .video-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: block;
        }

        .category-group.collapsed .video-list {
            display: none;
        }

        /* Các bài học con */
        .video-item {
            padding: 12px 30px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(0,0,0,0.02);
            transition: all 0.2s;
        }

        .video-item:hover {
            background: var(--hover-color);
            color: var(--text-color);
        }

        .video-item.active {
            color: var(--accent-color);
            font-weight: bold;
            background: var(--hover-color);
            border-left: 4px solid var(--accent-color);
            padding-left: 26px;
        }

        /* Giao diện Công tắc Switch Đổi Màu */
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444444;
            transition: 0.3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <span>Nội dung khóa học</span>
            <div class="theme-switch-wrapper">
                <span class="theme-text">Light</span>
                <label class="switch">
                    <input type="checkbox" id="theme-checkbox" onchange="toggleTheme()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div id="course-list"></div>
    </div>

    <div id="main">
        <!-- Đã cấu hình không lạm dụng autoplay để chặn đứng lỗi tự động tràn màn hình -->
        <video id="video-player" controls></video>
        <h2 id="current-title">Chọn bài học để bắt đầu</h2>
    </div>

    <script src="data.js"></script>
    <script>
        // Xử lý công tắc chuyển đổi giao diện Sáng / Tối
        function toggleTheme() {
            const checkbox = document.getElementById('theme-checkbox');
            if (checkbox.checked) {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
        }

        const container = document.getElementById('course-list');
        const player = document.getElementById('video-player');
        const title = document.getElementById('current-title');

        // Phân loại dữ liệu dựa trên cấu trúc file thực tế quét được
        const dataStore = {};
        if (typeof localVideos !== 'undefined') {
            localVideos.forEach(path => {
                const parts = path.split('/');
                if (parts.length > 1) {
                    const cat = parts[0];
                    if (!dataStore[cat]) dataStore[cat] = [];
                    dataStore[cat].push({ name: parts[parts.length - 1], path: path });
                }
            });
        }

        // Sắp xếp các danh mục cha chuẩn theo số thứ tự (ví dụ: 10 đứng sau 2)
        const sortedCategories = Object.keys(dataStore).sort((a, b) => 
            a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'})
        );

        // Xuất cây danh mục ra giao diện trực quan
        sortedCategories.forEach(cat => {
            const group = document.createElement('div');
            group.className = 'category-group'; // Giữ trạng thái mở mặc định, muốn đóng mặc định thì thêm lớp 'collapsed' tại đây
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'category-title';
            titleDiv.textContent = cat;
            
            // Tính năng thu gọn/mở rộng thư mục khi click vào tiêu đề
            titleDiv.onclick = () => {
                group.classList.toggle('collapsed');
            };
            
            const listUl = document.createElement('ul');
            listUl.className = 'video-list';
            
            // Sắp xếp bài học con bên trong danh mục
            dataStore[cat].sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}))
                .forEach(vid => {
                    const itemLi = document.createElement('li');
                    itemLi.className = 'video-item';
                    itemLi.textContent = vid.name.replace(/\.[^/.]+$/, ""); // Lọc bỏ phần mở rộng đuôi file (.mp4, .mkv)
                    
                    itemLi.onclick = () => { 
                        // Không dùng autoplay tự động kích hoạt hệ thống phát hình bừa bãi
                        player.src = encodeURI(vid.path); 
                        title.textContent = itemLi.textContent; 
                        
                        // Đánh dấu bài học đang chọn
                        document.querySelectorAll('.video-item').forEach(el => el.classList.remove('active'));
                        itemLi.classList.add('active');
                    };
                    listUl.appendChild(itemLi);
                });

            group.appendChild(titleDiv);
            group.appendChild(listUl);
            container.appendChild(group);
        });
    </script>
</body>
</html>
